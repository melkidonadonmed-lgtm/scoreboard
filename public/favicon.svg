<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#1e293b" stroke-width="4" opacity="0.6" />

  <!-- Medical Cross with smooth rounded corners -->
  <path d="M 212 96 C 212 85 221 76 232 76 L 280 76 C 291 76 300 85 300 96 L 300 212 L 416 212 C 427 212 436 221 436 232 L 436 280 C 436 291 427 300 416 300 L 300 300 L 300 416 C 300 427 291 436 280 436 L 232 436 C 221 436 212 427 212 416 L 212 300 L 96 300 C 85 300 76 291 76 280 L 76 232 C 76 221 85 212 96 212 L 212 212 Z"
        fill="url(#crossGrad)" filter="url(#glow)" />

  <!-- ECG / Rhythm / Scoreboard Pulse Line -->
  <polyline points="130,256 195,256 220,210 244,306 268,220 284,272 300,256 382,256"
            fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Scoreboard Data Indicators -->
  <circle cx="256" cy="140" r="8" fill="#ec4899" />
  <circle cx="372" cy="256" r="8" fill="#38bdf8" />
  <circle cx="256" cy="372" r="8" fill="#10b981" />
  <circle cx="140" cy="256" r="8" fill="#f59e0b" />
</svg>
